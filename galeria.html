<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Galería</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>

    <!-- Header -->
    <header class="bg-dark text-white text-center p-4">
        <h1>Galería de Imágenes</h1>
    </header>

    <!-- main -->
    <main>
        <!-- Galery -->
        <div class="row mt-4" id="galeria">
            <div class="text-center mb-4">
                <button class="btn btn-outline-primary m-1 filtro" data-categoria="todas">Todas</button>
                <button class="btn btn-outline-success m-1 filtro" data-categoria="naturaleza">Naturaleza</button>
                <button class="btn btn-outline-warning m-1 filtro" data-categoria="animales">Animales</button>
                <button class="btn btn-outline-info m-1 filtro" data-categoria="ciudades">Ciudades</button>
              </div>
            <div class="col-md-4 mb-4 galeria-item iron maiden">
                <img src="assets/1.jpg" alt="maiden1" class="img-fluid rounded" />
            </div>
            <div class="col-md-4 mb-4 galeria-item maiden2">
                <img src="assets/2.jpg" alt="maiden2" class="img-fluid rounded" />
            </div>
            <div class="col-md-4 mb-4 galeria-item maiden3">
                <img src="assets/3.jpg" alt="maiden3" class="img-fluid rounded" />
            </div>
        </div>
        <section class="text-center mb-5">
            <h2>Categorías Destacadas</h2>
            <p>Explora las imágenes según tus intereses</p>
            <div class="d-flex justify-content-center gap-3 flex-wrap">
                <a href="index.html" class="btn btn-primary">Volver al Inicio</a>
            </div>
        </section>
    </main>

        
    
        <!-- Footer-->
    <footer class="bg-dark text-white text-center p-3 mt-5">
       <p>&copy; Daniel Caicedo 2025</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
