<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Sobre Nosotros</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>

<!-- Header -->
    <header class="bg-dark text-white text-center p-4">
      <h1>Sobre Nosotros</h1>
    </header>

        <!-- Main -->
            <main class="container mt-4">
                <section class="mb-5">
                    <h2>Daniel Caicedo</h2>
                        <p>
                        Desarrollador en formación, apasionado por la web, la música y la
                        innovación.
                        </p>
                </section>
                <section>
                    <h3>Contáctame</h3>
                    <form id="form-contacto" class="row g-3">
                        <div class="col-md-6">
                            <label for="nombre" class="form-label">Nombre</label>
                            <input type="text" id="nombre" class="form-control" required />
                        </div>
                        <div class="col-md-6">
                            <label for="email" class="form-label">Correo electrónico</label>
                            <input type="email" id="email" class="form-control" required />
                        </div>
                        <div class="col-12">
                            <label for="mensaje" class="form-label">Mensaje</label>
                            <textarea id="mensaje" class="form-control" rows="4" required></textarea>
                        </div>
                        <div class="col-12">
                            <button type="submit" class="btn btn-primary">Enviar</button>
                        </div>
                    </form>
                </section>
            </main>

<!-- Footer -->
    <footer class="bg-dark text-white text-center p-3 mt-5">
      <p>&copy; Daniel Caicedo 2025</p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
