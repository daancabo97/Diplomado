<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <title>Sobre Nosotros</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="styles.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <script src="https://cdn.emailjs.com/dist/email.min.js"></script>
  <script>
    emailjs.init("gabnuJB9xzB3558oP");
  </script>
  <script src="script.js"></script>
</head>
<body>

  <!-- Sidebar -->
  <div class="sidebar"></div>

  <!-- Headerr -->
  <header class="bg-dark text-white text-center p-4">
    <div class="btn-toolbar" role="toolbar" aria-label="Toolbar with button groups">
      <div class="btn-group mr-2" role="group" aria-label="First group">
        <a href="index.html" class="btn btn-dark">Inicio</a>
        <a href="nosotros.html" class="btn btn-dark">Sobre Nosotros</a>
      </div>
    </div>
  </header>

  <!-- Main -->
  <main class="text-center mb-4">
    <h1>Sobre Nosotros</h1>
    <h3>Contáctanos</h3>
    <form id="form-contacto" class="row g-3">
      <div class="col-md-6">
        <label for="nombre" class="form-label">Nombre</label>
        <input type="text" id="nombre" name="name" class="form-control" required />
      </div>
      <div class="col-md-6">
        <label for="email" class="form-label">Correo electrónico</label>
        <input type="email" id="email" name="email" class="form-control" required />
      </div>
      <div class="col-12">
        <label for="mensaje" class="form-label">Mensaje</label>
        <textarea id="mensaje" name="message" class="form-control" rows="4" required></textarea>
      </div>
      <div class="col-12">
        <button type="submit" class="btn btn-primary">Enviar</button>
      </div>
    </form>
  </main>

  <!-- Footer -->
  <footer class="bg-dark text-white text-center p-3">
    <p>&copy; Daniel Caicedo 2025</p>
  </footer>

  <script src="script.js"></script>
</body>

</html>
